$defs:
  AddToolResponseData:
    description: ツールの追加に対するレスポンスのペイロードデータクラス
    properties: {}
    title: AddToolResponseData
    type: object
  AddToolResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: add_tool
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/AddToolResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - data
    - ok
    title: AddToolResponseSuccessPayload
    type: object
  CreateRomiResponseResponseData:
    description: ROMIの発話を表すレスポンスデータクラス
    properties:
      text:
        title: Romiの発話テキスト
        type: string
      emotion:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Romiの発話の感情
    required:
    - text
    title: CreateRomiResponseResponseData
    type: object
  CreateRomiResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: create_romi_response
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/CreateRomiResponseResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - data
    - ok
    title: CreateRomiResponseSuccessPayload
    type: object
  DiscoverAvailableRomisResponseData:
    description: 利用可能な Romi の発見に対するレスポンスのペイロードデータクラス
    properties:
      model:
        title: Romiのモデル名
        type: string
      serial_number:
        title: Romiのシリアルナンバー
        type: string
    required:
    - model
    - serial_number
    title: DiscoverAvailableRomisResponseData
    type: object
  DiscoverAvailableRomisResponsePayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: discover_available_romis
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/DiscoverAvailableRomisResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - data
    - ok
    title: DiscoverAvailableRomisResponsePayload
    type: object
  ErrorInfo:
    description: エラー情報のデータクラス
    properties:
      code:
        title: エラーコード
        type: string
      message:
        title: エラーメッセージ
        type: string
    required:
    - code
    - message
    title: ErrorInfo
    type: object
  ErrorResponsePayload:
    description: 'from_romi レスポンス共通のエラー payload。


      エラー時の構造は ``request_type`` 以外すべての API で同一のため、API ごとに

      クラスを分けず単一の payload に集約する。``request_type`` はこのモジュールが扱う

      種別（成功側と同じ集合）に限定し、方向違いのレスポンスを受理しないようにする。

      トップレベルの ``ok`` discriminator により、成功ユニオンと排他に振り分けられる。'
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        enum:
        - discover_available_romis
        - add_tool
        - remove_tool
        - create_romi_response
        - refresh_sdk_device_certificate
        - get_registered_tools
        - start_conversation_stream
        - stop_conversation_stream
        - speak_text
        title: リクエストタイプ
        type: string
      ok:
        const: false
        title: リクエストの処理が成功したかどうか
        type: boolean
      error:
        $ref: '#/$defs/ErrorInfo'
        title: エラーメッセージ (okがFalseの場合にエラー内容を記述)
    required:
    - request_id
    - request_type
    - ok
    - error
    title: ErrorResponsePayload
    type: object
  GetRegisteredToolsResponseData:
    description: 登録済みツール一覧取得レスポンスのペイロードデータクラス
    properties:
      tool_names:
        description: Romi に登録済みのツール名配列を設定します。
        examples:
        - - re_tool1
          - re_tool2
          - re_tool3
        items:
          type: string
        title: 登録済みツール名一覧
        type: array
    required:
    - tool_names
    title: GetRegisteredToolsResponseData
    type: object
  GetRegisteredToolsResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: get_registered_tools
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/GetRegisteredToolsResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - data
    - ok
    title: GetRegisteredToolsResponseSuccessPayload
    type: object
  RefreshSdkDeviceCertificateResponseData:
    description: SDK デバイス証明書の更新に対するレスポンスのペイロードデータクラス
    properties:
      ca_chain:
        description: 更新された SDK デバイス証明書の CA チェーンを設定します。
        examples:
        - '-----BEGIN CERTIFICATE-----

          *******

          -----END CERTIFICATE-----'
        title: CAチェーン文字列
        type: string
      certificate:
        description: 更新された SDK デバイス証明書を設定します。
        examples:
        - '-----BEGIN CERTIFICATE-----

          *******

          -----END CERTIFICATE-----'
        title: 証明書文字列
        type: string
    required:
    - ca_chain
    - certificate
    title: RefreshSdkDeviceCertificateResponseData
    type: object
  RefreshSdkDeviceCertificateResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: refresh_sdk_device_certificate
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/RefreshSdkDeviceCertificateResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - data
    - ok
    title: RefreshSdkDeviceCertificateResponseSuccessPayload
    type: object
  RemoveToolResponseData:
    description: ツール削除に対するレスポンスのペイロードデータクラス
    properties: {}
    title: RemoveToolResponseData
    type: object
  RemoveToolResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: remove_tool
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/RemoveToolResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - data
    - ok
    title: RemoveToolResponseSuccessPayload
    type: object
  SpeakTextResponseData:
    description: Romiへのテキストの発話リクエストに対するレスポンスペイロードデータクラス
    properties: {}
    title: SpeakTextResponseData
    type: object
  SpeakTextResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: speak_text
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/SpeakTextResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - ok
    title: SpeakTextResponseSuccessPayload
    type: object
  StartConversationStreamResponseData:
    description: 会話ストリーム開始リクエストへのレスポンスペイロードデータクラス
    properties: {}
    title: StartConversationStreamResponseData
    type: object
  StartConversationStreamResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: start_conversation_stream
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/StartConversationStreamResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - ok
    title: StartConversationStreamResponseSuccessPayload
    type: object
  StopConversationStreamResponseData:
    description: 会話ストリーム停止リクエストへのレスポンスペイロードデータクラス
    properties: {}
    title: StopConversationStreamResponseData
    type: object
  StopConversationStreamResponseSuccessPayload:
    properties:
      request_id:
        title: リクエストID
        type: string
      request_type:
        const: stop_conversation_stream
        title: リクエストタイプ
        type: string
      data:
        $ref: '#/$defs/StopConversationStreamResponseData'
        title: レスポンスデータ
      ok:
        const: true
        title: リクエストの処理が成功したかどうか
        type: boolean
    required:
    - request_id
    - request_type
    - ok
    title: StopConversationStreamResponseSuccessPayload
    type: object
discriminator: ok
oneOf:
- discriminator: request_type
  oneOf:
  - $ref: '#/$defs/DiscoverAvailableRomisResponsePayload'
  - $ref: '#/$defs/AddToolResponseSuccessPayload'
  - $ref: '#/$defs/RemoveToolResponseSuccessPayload'
  - $ref: '#/$defs/CreateRomiResponseSuccessPayload'
  - $ref: '#/$defs/RefreshSdkDeviceCertificateResponseSuccessPayload'
  - $ref: '#/$defs/GetRegisteredToolsResponseSuccessPayload'
  - $ref: '#/$defs/StartConversationStreamResponseSuccessPayload'
  - $ref: '#/$defs/StopConversationStreamResponseSuccessPayload'
  - $ref: '#/$defs/SpeakTextResponseSuccessPayload'
- $ref: '#/$defs/ErrorResponsePayload'
