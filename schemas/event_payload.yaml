$defs:
  ConnectionStatusChangedEventPayload:
    description: connection_status_changed event のペイロード。
    properties:
      event_id:
        title: イベントID
        type: string
      type:
        const: connection_status_changed
        title: イベントタイプ
        type: string
      data:
        discriminator: status
        oneOf:
        - $ref: '#/$defs/OnlineStatusData'
        - $ref: '#/$defs/OfflineStatusData'
        title: イベントデータ
    required:
    - event_id
    - type
    - data
    title: ConnectionStatusChangedEventPayload
    type: object
  ConversationSpeaker:
    description: 会話ストリームで扱う話者の指定
    enum:
    - romi
    title: ConversationSpeaker
    type: string
  ConversationStreamingEventData:
    description: conversation_streaming イベントのデータ。
    properties:
      speaker:
        $ref: '#/$defs/ConversationSpeaker'
        title: 話者
      utterance_text:
        title: 発話テキスト
        type: string
      timestamp:
        title: UNIXタイムスタンプ
        type: integer
    required:
    - speaker
    - utterance_text
    - timestamp
    title: ConversationStreamingEventData
    type: object
  ConversationStreamingEventPayload:
    description: conversation_streaming event のペイロード。
    properties:
      event_id:
        title: イベントID
        type: string
      type:
        const: conversation_streaming
        title: イベントタイプ
        type: string
      data:
        $ref: '#/$defs/ConversationStreamingEventData'
        title: イベントデータ
    required:
    - event_id
    - type
    - data
    title: ConversationStreamingEventPayload
    type: object
  OfflineReason:
    description: '``offline`` になった理由。'
    enum:
    - shutdown
    - last_will
    title: OfflineReason
    type: string
  OfflineStatusData:
    description: 'connection_status_changed イベント（``offline``）のデータ。


      ``reason`` は必須。'
    properties:
      status:
        const: offline
        default: offline
        title: 接続状態
        type: string
      reason:
        $ref: '#/$defs/OfflineReason'
        title: 切断理由
    required:
    - reason
    title: OfflineStatusData
    type: object
  OnlineStatusData:
    description: 'connection_status_changed イベント（``online``）のデータ。


      ``reason`` は持たない。'
    properties:
      status:
        const: online
        default: online
        title: 接続状態
        type: string
    title: OnlineStatusData
    type: object
  RequestedToolCall:
    description: Romiからツールの呼び出し要求を受信するペイロードクラス
    properties:
      name:
        examples:
        - get_picture
        title: ツールの名前
        type: string
      call_id:
        examples:
        - '12345'
        title: ツールの呼び出し ID
        type: string
      arguments_json:
        examples:
        - '{"param1": "value1"}'
        title: ツールの引数 JSON
        type: string
    required:
    - name
    - call_id
    - arguments_json
    title: RequestedToolCall
    type: object
  ToolCallInvokedEventPayload:
    description: tool_call_invoked event のペイロード。
    properties:
      event_id:
        title: イベントID
        type: string
      type:
        const: tool_call_invoked
        title: イベントタイプ
        type: string
      data:
        $ref: '#/$defs/RequestedToolCall'
        title: イベントデータ
    required:
    - event_id
    - type
    - data
    title: ToolCallInvokedEventPayload
    type: object
discriminator: type
oneOf:
- $ref: '#/$defs/ToolCallInvokedEventPayload'
- $ref: '#/$defs/ConversationStreamingEventPayload'
- $ref: '#/$defs/ConnectionStatusChangedEventPayload'
